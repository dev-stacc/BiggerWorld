<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>homepage</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: {{base00}};
            color: {{base04}};
            font-family: "{{fontName}}", monospace;
            font-size: {{fontSize}}px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cmds {
            color: {{base05}};
        }
        .cmds div {
            margin: 0.2em 0;
        }
        .key {
            color: {{base02}};
            display: inline-block;
            width: 8em;
        }
    </style>
</head>
<body>
    <div class="cmds">
        <div><span class="key">o</span>open url/search</div>
        <div><span class="key">t</span>open in new tab</div>
        <div><span class="key">f</span>hint mode</div>
        <div><span class="key">d</span>close tab</div>
        <div><span class="key">u</span>undo close tab</div>
        <div><span class="key">shift+l</span>previous page</div>
        <div><span class="key">shift+h</span>next page</div>
        <div><span class="key">yy</span>yank url</div>
    </div>
</body>
</html>
