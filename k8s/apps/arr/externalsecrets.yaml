apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-vpn
  namespace: arr
spec:
  refreshInterval: 1m
  target:
    name: gluetun-vpn
  data:
    - secretKey: OPENVPN_USER
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: secret/gluetun
        property: openvpn-user
    - secretKey: OPENVPN_PASSWORD
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: secret/gluetun
        property: openvpn-password
