apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-vpn
  namespace: arr
spec:
  refreshInterval: 1m
  target:
    name: gluetun-vpn
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: secret/gluetun
        property: wireguard-private-key
    - secretKey: WIREGUARD_ADDRESSES
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: secret/gluetun
        property: wireguard-addresses
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr-api
  namespace: arr
spec:
  refreshInterval: 1m
  target:
    name: recyclarr-api
  data:
    - secretKey: SONARR_API_KEY
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: secret/recyclarr
        property: sonarr-api-key
    - secretKey: RADARR_API_KEY
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: secret/recyclarr
        property: radarr-api-key
