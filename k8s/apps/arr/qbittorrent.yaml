apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: arr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: asta
      hostAliases:
        - ip: 10.43.173.16
          hostnames:
            - sonarr.arr.svc.cluster.local
        - ip: 10.43.167.2
          hostnames:
            - radarr.arr.svc.cluster.local
        - ip: 10.43.129.95
          hostnames:
            - lidarr.arr.svc.cluster.local
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
      initContainers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3
          restartPolicy: Always
          env:
            - name: VPN_SERVICE_PROVIDER
              value: mullvad
            - name: VPN_TYPE
              value: wireguard
            - name: VPN_ENDPOINT_IP
              value: 193.32.249.69
            - name: VPN_ENDPOINT_PORT
              value: "51820"
            - name: WIREGUARD_PUBLIC_KEY
              value: hnRyse6QxPPcZOoSwRsHUtK1W+APWXnIoaDTmH6JsHQ=
            - name: WIREGUARD_MTU
              value: "1360"
            - name: FIREWALL_INPUT_PORTS
              value: "8080,9696"
            - name: HEALTH_TARGET_ADDRESS
              value: 1.1.1.1:443
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: 10.42.0.0/16,10.43.0.0/16
          envFrom:
            - secretRef:
                name: gluetun-vpn
                optional: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - ip -6 rule del table 51820 || true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - CHOWN
                - DAC_OVERRIDE
                - SETUID
                - SETGID
                - FOWNER
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: gluetun-config
              mountPath: /gluetun
            - name: tun
              mountPath: /dev/net/tun
          startupProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
      containers:
        - name: qbittorrent
          image: linuxserver/qbittorrent:5.2.4_v2.0.15-ls480
          ports:
            - containerPort: 8080
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "002"
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6881"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
                - FOWNER
                - DAC_OVERRIDE
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            failureThreshold: 4
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
        - name: prowlarr
          image: linuxserver/prowlarr:2.6.5.5623-ls163
          ports:
            - containerPort: 9696
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "002"
            - name: PROWLARR__AUTH__METHOD
              value: External
            - name: PROWLARR__AUTH__REQUIRED
              value: Enabled
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
                - FOWNER
                - DAC_OVERRIDE
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config
          startupProbe:
            httpGet:
              path: /ping
              port: 9696
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 9696
            periodSeconds: 10
            failureThreshold: 4
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1"
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
          ports:
            - containerPort: 8191
          env:
            - name: LOG_LEVEL
              value: info
            - name: TZ
              value: UTC
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /
              port: 8191
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: gluetun-config
          persistentVolumeClaim:
            claimName: gluetun-config
        - name: data
          hostPath:
            path: ${MEDIA_HOST_PATH}
            type: Directory
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: arr
spec:
  selector:
    app: qbittorrent
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
