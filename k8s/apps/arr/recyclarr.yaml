apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: arr
data:
  recyclarr.yml: |
    sonarr:
      web-1080p:
        base_url: http://sonarr.arr.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            reset_unmatched_scores:
              enabled: true
        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
              exclude:
              select:
            - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4  # [Optional] Language Profiles
              exclude:
              select:
            - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
              exclude:
            - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
              exclude:
              select:
          skip:
    radarr:
      sqp-1-web-1080p:
        base_url: http://radarr.arr.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY
        quality_definition:
          type: sqp-streaming
        quality_profiles:
          - trash_id: 90a3370d2d30cbaf08d9c23b856a12c8  # [SQP] SQP-1 WEB (1080p)
            reset_unmatched_scores:
              enabled: true
        custom_format_groups:
          add:
            - trash_id: 15b1cf0b6f1a1493856a4355907affee  # [Unwanted] Unwanted Formats SQP
              exclude:
              select:
          skip:
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: arr
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: recyclarr
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: asta
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.7.3
              args:
                - sync
              envFrom:
                - secretRef:
                    name: recyclarr-api
                    optional: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: state
                  mountPath: /config
                - name: config
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          volumes:
            - name: state
              emptyDir: {}
            - name: config
              configMap:
                name: recyclarr-config
