apiVersion: v1
kind: ConfigMap
metadata:
  name: arr-config
  namespace: arr
data:
  desired-priorities.json: |
    {
      "Knaben": 10,
      "Anime Tosho": 15,
      "Nyaa.si": 15,
      "SubsPlease": 15,
      "showRSS": 20,
      "YTS": 20,
      "BigFANGroup": 30,
      "LimeTorrents": 30,
      "The Pirate Bay": 40,
      "TorrentDownload": 40,
      "Torrent Downloads": 45
    }
  apply.sh: |
    set -eu
    apk add --no-cache curl jq >/dev/null 2>&1

    rc=0

    apply() {
      label=$$1; base=$$2; key=$$3; ep=$$4; filter=$$5
      cur=$$(curl -sf -m20 "$$base/$$ep" -H "X-Api-Key: $$key") || {
        echo "  [$$label] $$ep GET failed"; rc=1; return 0; }
      new=$$(printf '%s' "$$cur" | jq -c "$$filter")
      if [ "$$(printf '%s' "$$cur" | jq -cS .)" = "$$(printf '%s' "$$new" | jq -cS .)" ]; then
        echo "  [$$label] $$ep already correct"
      elif curl -sf -m30 -X PUT "$$base/$$ep" -H "X-Api-Key: $$key" \
            -H 'Content-Type: application/json' -d "$$new" >/dev/null; then
        echo "  [$$label] $$ep updated"
      else
        echo "  [$$label] $$ep PUT failed"; rc=1
      fi
    }

    MM='.deleteEmptyFolders=true | .copyUsingHardlinks=true | .recycleBin="/data/.recyclebin" | .recycleBinCleanupDays=7'
    DP='.preferredProtocol="torrent" | .enableUsenet=false'

    S=http://sonarr.arr.svc.cluster.local:8989/api/v3
    apply sonarr "$$S" "$$SONARR_API_KEY" config/naming '.renameEpisodes=true'
    apply sonarr "$$S" "$$SONARR_API_KEY" config/mediamanagement "$$MM"
    apply sonarr "$$S" "$$SONARR_API_KEY" delayprofile/1 "$$DP"

    R=http://radarr.arr.svc.cluster.local:7878/api/v3
    apply radarr "$$R" "$$RADARR_API_KEY" config/naming '.renameMovies=true'
    apply radarr "$$R" "$$RADARR_API_KEY" config/mediamanagement "$$MM"
    apply radarr "$$R" "$$RADARR_API_KEY" delayprofile/1 "$$DP"

    if [ -n "$${PROWLARR_API_KEY:-}" ]; then
      P=http://prowlarr.arr.svc.cluster.local:9696/api/v1
      apply prowlarr "$$P" "$$PROWLARR_API_KEY" appprofile/1 '.minimumSeeders=3'
      idx=$$(curl -sf -m20 "$$P/indexer" -H "X-Api-Key: $$PROWLARR_API_KEY") || {
        echo "  [prowlarr] indexer GET failed"; idx=''; rc=1; }
      if [ -n "$$idx" ]; then
        jq -r 'to_entries[] | "\(.key)\t\(.value)"' /etc/arr-config/desired-priorities.json |
        while IFS="$$(printf '\t')" read -r nm pr; do
          id=$$(printf '%s' "$$idx" | jq -r --arg n "$$nm" '.[] | select(.name==$$n) | .id')
          if [ -z "$$id" ]; then echo "  [prowlarr] $$nm not present, skipped"; continue; fi
          apply prowlarr "$$P" "$$PROWLARR_API_KEY" "indexer/$$id" ".priority=$$pr"
        done
      fi
    else
      echo "  [prowlarr] PROWLARR_API_KEY unset, skipping indexer priorities"
    fi


    rename_pending() {
      label=$$1; base=$$2; key=$$3; listep=$$4; qp=$$5; cmd=$$6; idsf=$$7
      pending=""
      for id in $$(curl -sf -m30 "$$base/$$listep" -H "X-Api-Key: $$key" | jq -r '.[].id'); do
        n=$$(curl -sf -m30 "$$base/rename?$$qp=$$id" -H "X-Api-Key: $$key" | jq 'length') || continue
        if [ "$$n" -gt 0 ] 2>/dev/null; then pending="$$pending$$id,"; fi
      done
      if [ -z "$$pending" ]; then
        echo "  [$$label] no files need renaming"
        return 0
      fi
      ids=$${pending%,}
      if curl -sf -m60 -X POST "$$base/command" -H "X-Api-Key: $$key" \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"$$cmd\",\"$$idsf\":[$$ids]}" >/dev/null; then
        echo "  [$$label] $$cmd queued for ids $$ids"
      else
        echo "  [$$label] $$cmd failed"; rc=1
      fi
    }

    rename_pending sonarr "$$S" "$$SONARR_API_KEY" series seriesId RenameSeries seriesIds
    rename_pending radarr "$$R" "$$RADARR_API_KEY" movie movieId RenameMovie movieIds

    exit $$rc
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arr-config
  namespace: arr
spec:
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: arr-config
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: asta
          initContainers:
            - name: ensure-recyclebin
              image: alpine:3.21
              command:
                - /bin/sh
                - -c
                - mkdir -p /data/.recyclebin
              securityContext:
                runAsUser: 1000
                runAsGroup: 100
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: data
                  mountPath: /data
          containers:
            - name: arr-config
              image: alpine:3.21
              command:
                - /bin/sh
                - /etc/arr-config/apply.sh
              envFrom:
                - secretRef:
                    name: recyclarr-api
                - secretRef:
                    name: prowlarr-api
                    optional: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: config
                  mountPath: /etc/arr-config
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "25m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
          volumes:
            - name: data
              hostPath:
                path: /home/anastasia/media
                type: Directory
            - name: config
              configMap:
                name: arr-config
