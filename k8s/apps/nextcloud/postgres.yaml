apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: nextcloud
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two postgres pods must never hold the same
    # hostPath data directory open at once.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Pinned to albireo because the data directory is a hostPath on its ZFS
      # pool. Unlike the local-path PVC used elsewhere, this is not portable.
      nodeSelector:
        kubernetes.io/hostname: albireo
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: POSTGRES_PASSWORD
            # Keep the cluster in a subdirectory rather than at the mount root,
            # so initdb never has to contend with anything the mount itself owns.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "nextcloud"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "nextcloud"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        # On ZFS so the database snapshots and replicates with the files it
        # describes. Must be owned by uid 999 on albireo (see storage.nix).
        - name: postgres-data
          hostPath:
            path: /srv/nextcloud/db
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nextcloud
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow
  namespace: nextcloud
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nextcloud
        # The nightly pg_dump CronJob, which carries its own label precisely so
        # it is not picked up by the nextcloud Service's selector.
        - podSelector:
            matchLabels:
              app: nextcloud-dump
      ports:
        - protocol: TCP
          port: 5432
  egress: []
