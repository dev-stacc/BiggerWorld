apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-db-dump
  namespace: nextcloud
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            # NOT app: nextcloud - that is the Service selector, and web
            # traffic would get routed to this job's pod
            app: nextcloud-dump
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: albireo
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          containers:
            - name: pg-dump
              image: postgres:16
              env:
                - name: PGHOST
                  value: postgres
                - name: PGDATABASE
                  value: nextcloud
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-secrets
                      key: POSTGRES_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  out=/dumps/nextcloud.sql.gz
                  pg_dump --clean --if-exists | gzip -9 > "$out.tmp"
                  mv "$out.tmp" "$out"
                  echo "wrote $out ($(stat -c %s "$out") bytes)"
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 512Mi
                  cpu: 500m
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: dumps
              hostPath:
                path: /srv/nextcloud/dumps
                type: Directory
