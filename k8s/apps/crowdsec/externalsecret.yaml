apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-secret
  namespace: crowdsec
spec:
  refreshInterval: 1m
  target:
    name: crowdsec-secret
  data:
    - secretKey: enrollment-key
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: secret/crowdsec
        property: enrollment-key
    # Registers albireo's firewall bouncer with the LAPI. The same value must be
    # added to secrets/secrets.yaml as crowdsec-firewall-bouncer-api-key, which
    # is what albireo itself reads - the two copies have to match.
    - secretKey: albireo-firewall-bouncer-key
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: secret/crowdsec
        property: albireo-firewall-bouncer-key
