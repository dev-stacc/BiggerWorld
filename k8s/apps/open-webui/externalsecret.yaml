apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-secrets
  namespace: open-webui
spec:
  refreshInterval: 1m
  target:
    name: open-webui-secrets
  data:
    - secretKey: OPENAI_API_KEY
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: secret/open-webui
        property: OPENAI_API_KEY
