apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: egress
spec:
  type: egress
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-egress
  namespace: tailscale
  annotations:
    tailscale.com/tailnet-fqdn: authentik.${TAILNET_DOMAIN}
    tailscale.com/proxy-group: egress
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: https
      port: 443
      protocol: TCP
