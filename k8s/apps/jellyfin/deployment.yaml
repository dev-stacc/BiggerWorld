apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        kubernetes.io/hostname: asta
      hostAliases:
        - ip: 10.43.174.95
          hostnames:
            - authentik.${TAILNET_DOMAIN}
      initContainers:
        - name: install-sso-plugin
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              set -e
              PLUGIN_DIR=/config/plugins
              if ls "$PLUGIN_DIR"/SSO-Auth_* 2>/dev/null | grep -q .; then
                echo "SSO-Auth already installed, skipping"
                exit 0
              fi
              apk add --no-cache curl jq unzip ca-certificates
              MANIFEST=$(curl -fsSL https://raw.githubusercontent.com/9p4/jellyfin-plugin-sso/manifest-release/manifest.json)
              INFO=$(echo "$MANIFEST" | jq -r '.[0].versions[] | select(.targetAbi | startswith("10.11")) | [.sourceUrl,.version,.checksum] | @tsv' | head -1)
              if [ -z "$INFO" ]; then
                INFO=$(echo "$MANIFEST" | jq -r '[.[0].versions[0].sourceUrl, .[0].versions[0].version, .[0].versions[0].checksum] | @tsv')
              fi
              SOURCE_URL=$(echo "$INFO" | cut -f1)
              PLUGIN_VERSION=$(echo "$INFO" | cut -f2)
              EXPECTED_CHECKSUM=$(echo "$INFO" | cut -f3)
              ATTEMPTS=0
              while true; do
                ATTEMPTS=$((ATTEMPTS + 1))
                echo "Downloading SSO-Auth $PLUGIN_VERSION from $SOURCE_URL (attempt $ATTEMPTS)"
                curl -fsSL -o /tmp/sso.zip "$SOURCE_URL"
                ACTUAL_CHECKSUM=$(md5sum /tmp/sso.zip | cut -d' ' -f1)
                if [ "$ACTUAL_CHECKSUM" = "$EXPECTED_CHECKSUM" ]; then
                  echo "Checksum verified"
                  break
                fi
                echo "Checksum mismatch (attempt $ATTEMPTS): expected=$EXPECTED_CHECKSUM got=$ACTUAL_CHECKSUM, retrying..."
                rm -f /tmp/sso.zip
              done
              mkdir -p "$PLUGIN_DIR/SSO-Auth_$${PLUGIN_VERSION}"
              unzip -o /tmp/sso.zip -d "$PLUGIN_DIR/SSO-Auth_$${PLUGIN_VERSION}"
              echo "SSO-Auth installed"
          volumeMounts:
            - name: config
              mountPath: /config
        - name: configure-sso
          image: alpine:3.19
          envFrom:
            - secretRef:
                name: jellyfin-oidc
                optional: true
          command:
            - sh
            - -c
            - |
              set -e
              CFG=/config/plugins/configurations
              NET=/config/config/network.xml
              CIDR=10.42.0.0/16
              mkdir -p "$$CFG"
              if [ ! -f "$$NET" ]; then
                echo "network.xml absent, jellyfin will create it"
              elif grep -q "$$CIDR" "$$NET"; then
                echo "KnownProxies already contains $$CIDR"
              else
                sed -i "s#<KnownProxies />#<KnownProxies><string>$$CIDR</string></KnownProxies>#" "$$NET"
                sed -i "s#<KnownProxies></KnownProxies>#<KnownProxies><string>$$CIDR</string></KnownProxies>#" "$$NET"
                grep -q "$$CIDR" "$$NET" && echo "patched KnownProxies" || echo "could not patch KnownProxies"
              fi
              if [ -z "$$JELLYFIN_OIDC_CLIENT_ID" ] || [ -z "$$JELLYFIN_OIDC_CLIENT_SECRET" ]; then
                echo "OIDC credentials unavailable, leaving SSO-Auth.xml untouched"
              else
                cat > "$$CFG/SSO-Auth.xml" <<EOF
              <?xml version="1.0" encoding="utf-8"?>
              <PluginConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
                <SamlConfigs />
                <OidConfigs>
                  <item>
                    <key>
                      <string>Authentik</string>
                    </key>
                    <value>
                      <PluginConfiguration>
                        <OidEndpoint>https://authentik.${TAILNET_DOMAIN}/application/o/jellyfin-oidc/</OidEndpoint>
                        <OidClientId>$$JELLYFIN_OIDC_CLIENT_ID</OidClientId>
                        <OidSecret>$$JELLYFIN_OIDC_CLIENT_SECRET</OidSecret>
                        <Enabled>true</Enabled>
                        <EnableAuthorization>false</EnableAuthorization>
                        <EnableAllFolders>true</EnableAllFolders>
                        <EnabledFolders />
                        <AdminRoles>
                          <string>authentik Admins</string>
                        </AdminRoles>
                        <Roles />
                        <EnableFolderRoles>false</EnableFolderRoles>
                        <EnableLiveTvRoles>false</EnableLiveTvRoles>
                        <EnableLiveTv>false</EnableLiveTv>
                        <EnableLiveTvManagement>false</EnableLiveTvManagement>
                        <LiveTvRoles />
                        <LiveTvManagementRoles />
                        <RoleClaim>groups</RoleClaim>
                        <OidScopes>
                          <string>openid</string>
                          <string>profile</string>
                          <string>email</string>
                        </OidScopes>
                        <PortOverride xsi:nil="true" />
                        <NewPath>false</NewPath>
                        <CanonicalLinks />
                        <DefaultUsernameClaim>preferred_username</DefaultUsernameClaim>
                        <AvatarUrlFormat />
                        <DisableHttps>false</DisableHttps>
                        <DisablePushedAuthorization>false</DisablePushedAuthorization>
                        <DoNotValidateEndpoints>true</DoNotValidateEndpoints>
                        <DoNotValidateIssuerName>true</DoNotValidateIssuerName>
                        <DoNotLoadProfile>false</DoNotLoadProfile>
                      </PluginConfiguration>
                    </value>
                  </item>
                </OidConfigs>
              </PluginConfiguration>
              EOF
                echo "wrote SSO-Auth.xml"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          ports:
            - containerPort: 8096
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "4"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          hostPath:
            path: ${MEDIA_HOST_PATH}
            type: Directory
