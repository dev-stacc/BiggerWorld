apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-proxy
  namespace: monitoring
data:
  nginx.conf: |
    events {}
    http {
      access_log off;
      upstream loki {
        server loki.monitoring.svc.cluster.local:3100;
      }
      server {
        listen 3100;

        location = /nginx-health {
          auth_basic off;
          return 200 "ok\n";
        }

        location / {
          auth_basic "loki";
          auth_basic_user_file /etc/nginx/auth/htpasswd;
          proxy_pass http://loki;
          proxy_set_header Host $$host;
          proxy_http_version 1.1;
          client_max_body_size 64m;
          proxy_read_timeout 300s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-proxy
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki-proxy
  template:
    metadata:
      labels:
        app: loki-proxy
    spec:
      initContainers:
        - name: htpasswd
          image: alpine:3.19
          env:
            - name: LOKI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loki-auth
                  key: password
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache apache2-utils
              htpasswd -cbB /auth/htpasswd alloy "$$LOKI_PASSWORD"
              chmod 0644 /auth/htpasswd
              echo "htpasswd generated for user alloy"
          volumeMounts:
            - name: auth
              mountPath: /auth
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: auth
              mountPath: /etc/nginx/auth
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 3100
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 500m
      volumes:
        - name: config
          configMap:
            name: loki-proxy
        - name: auth
          emptyDir: {}
