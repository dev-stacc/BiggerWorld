apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-db-dump
  namespace: immich
spec:
  schedule: "30 23 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: immich-dump
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/hostname: albireo
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          containers:
            - name: pg-dump
              image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PGHOST
                  value: immich-postgres
                - name: PGDATABASE
                  value: immich
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: immich-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-secrets
                      key: POSTGRES_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  out=/dumps/immich.sql.gz
                  pg_dump --clean --if-exists | gzip -9 > "$out.tmp"
                  mv "$out.tmp" "$out"
                  echo "wrote $out ($(stat -c %s "$out") bytes)"
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 512Mi
                  cpu: 500m
          volumes:
            - name: dumps
              hostPath:
                path: /bigstorage/immich/dumps
                type: Directory
