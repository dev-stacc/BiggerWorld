apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-unsealer
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-unsealer
  template:
    metadata:
      labels:
        app: vault-unsealer
    spec:
      containers:
        - name: unsealer
          image: hashicorp/vault:2.1.2
          env:
            - name: VAULT_ADDR
              value: http://vault-0.vault-internal.vault.svc.cluster.local:8200
            - name: UNSEAL_KEY_1
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: key1
            - name: UNSEAL_KEY_2
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: key2
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                VAULT_CLIENT_TIMEOUT=5 timeout 15 vault status > /dev/null 2>&1
                STATUS=$?
                if [ $STATUS -eq 2 ]; then
                  echo "Vault sealed, unsealing..."
                  VAULT_CLIENT_TIMEOUT=5 timeout 15 vault operator unseal "$UNSEAL_KEY_1"
                  VAULT_CLIENT_TIMEOUT=5 timeout 15 vault operator unseal "$UNSEAL_KEY_2"
                elif [ $STATUS -ne 0 ]; then
                  echo "Vault unreachable (rc=$STATUS), will retry..."
                fi
                sleep 10
              done
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "500m"
