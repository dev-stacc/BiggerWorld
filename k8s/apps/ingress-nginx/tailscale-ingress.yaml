apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ts-nextcloud
  namespace: ingress-nginx
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: nextcloud
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: ingress-nginx-controller
      port:
        number: 80
  tls:
    - hosts:
        - nextcloud
