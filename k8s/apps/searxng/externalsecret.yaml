apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-secrets
  namespace: searxng
spec:
  refreshInterval: 1m
  target:
    name: searxng-secrets
  data:
    - secretKey: SEARXNG_SECRET
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: searxng
        property: SEARXNG_SECRET
