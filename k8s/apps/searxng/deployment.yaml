apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
spec:
  replicas: 2
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        - name: searxng
          image: ghcr.io/dev-stacc/searxng:20261015071223-a98ffeb87058baa58ff1e3250140b93afa05a86a # {"$imagepolicy": "flux-system:searxng"}
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_BASE_URL
              value: https://search.${TAILNET_DOMAIN}/
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secrets
                  key: SEARXNG_SECRET
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1"
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
