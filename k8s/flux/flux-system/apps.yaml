apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/apps
  prune: true
  # wait:false is load-bearing. The ClusterSecretStore lives in apps-config,
  # which dependsOn apps. With wait:true, apps could never report Ready until
  # every app Deployment was healthy - but those Deployments need secrets that
  # only sync once the store exists. That was an unbreakable cycle on a fresh
  # cluster. Applying apps is enough to unblock apps-config; the ExternalSecrets
  # retry every 1m until the store lands.
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-config
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: apps
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/apps-config
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  force: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
