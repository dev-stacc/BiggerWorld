apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-open-webui
  namespace: authentik
data:
  open-webui.yaml: |
    version: 1
    metadata:
      name: Open WebUI Application
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: open-webui-provider
        state: present
        identifiers:
          name: Open WebUI Provider
        attrs:
          name: Open WebUI Provider
          mode: forward_single
          external_host: https://chat.${TAILNET_DOMAIN}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: open-webui
        attrs:
          name: Open WebUI
          slug: open-webui
          provider: !KeyOf open-webui-provider
