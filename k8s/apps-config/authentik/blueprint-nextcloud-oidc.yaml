apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-nextcloud-oidc
  namespace: authentik
data:
  nextcloud-oidc.yaml: |
    version: 1
    metadata:
      name: Nextcloud OIDC Application
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: nextcloud-oidc-provider
        state: present
        identifiers:
          name: nextcloud-oidc
        attrs:
          name: nextcloud-oidc
          client_id: !Env NEXTCLOUD_OIDC_CLIENT_ID
          client_secret: !Env NEXTCLOUD_OIDC_CLIENT_SECRET
          # Required since authentik 2026.x: an OAuth2 provider created without this
          # gets grant_types=[] and rejects the code flow with "Invalid grant_type
          # for provider", which surfaces to the client only as invalid_request.
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: https://nextcloud.${TAILNET_DOMAIN}/apps/user_oidc/code
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # no cert carries managed=goauthentik.io/crypto/default-certificate, so
          # that lookup silently yielded null and authentik fell back to HS256,
          # which user_oidc rejects. match the self-signed cert by name instead.
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          sub_mode: hashed_user_id
          issuer_mode: per_provider

      - model: authentik_core.application
        state: present
        identifiers:
          slug: nextcloud-oidc
        attrs:
          name: Nextcloud
          slug: nextcloud-oidc
          provider: !KeyOf nextcloud-oidc-provider
