apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-arr
  namespace: authentik
data:
  arr.yaml: |
    version: 1
    metadata:
      name: Arr Stack Applications
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: qbittorrent-provider
        state: present
        identifiers:
          name: qBittorrent Provider
        attrs:
          name: qBittorrent Provider
          mode: forward_single
          external_host: https://torrents.${TAILNET_DOMAIN}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: qbittorrent
        attrs:
          name: qBittorrent
          slug: qbittorrent
          provider: !KeyOf qbittorrent-provider

      - model: authentik_providers_proxy.proxyprovider
        id: prowlarr-provider
        state: present
        identifiers:
          name: Prowlarr Provider
        attrs:
          name: Prowlarr Provider
          mode: forward_single
          external_host: https://prowlarr.${TAILNET_DOMAIN}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: prowlarr
        attrs:
          name: Prowlarr
          slug: prowlarr
          provider: !KeyOf prowlarr-provider

      - model: authentik_providers_proxy.proxyprovider
        id: sonarr-provider
        state: present
        identifiers:
          name: Sonarr Provider
        attrs:
          name: Sonarr Provider
          mode: forward_single
          external_host: https://sonarr.${TAILNET_DOMAIN}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: sonarr
        attrs:
          name: Sonarr
          slug: sonarr
          provider: !KeyOf sonarr-provider

      - model: authentik_providers_proxy.proxyprovider
        id: radarr-provider
        state: present
        identifiers:
          name: Radarr Provider
        attrs:
          name: Radarr Provider
          mode: forward_single
          external_host: https://radarr.${TAILNET_DOMAIN}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: radarr
        attrs:
          name: Radarr
          slug: radarr
          provider: !KeyOf radarr-provider

      - model: authentik_providers_proxy.proxyprovider
        id: lidarr-provider
        state: present
        identifiers:
          name: Lidarr Provider
        attrs:
          name: Lidarr Provider
          mode: forward_single
          external_host: https://lidarr.${TAILNET_DOMAIN}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: lidarr
        attrs:
          name: Lidarr
          slug: lidarr
          provider: !KeyOf lidarr-provider

      - model: authentik_providers_proxy.proxyprovider
        id: bazarr-provider
        state: present
        identifiers:
          name: Bazarr Provider
        attrs:
          name: Bazarr Provider
          mode: forward_single
          external_host: https://bazarr.${TAILNET_DOMAIN}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: bazarr
        attrs:
          name: Bazarr
          slug: bazarr
          provider: !KeyOf bazarr-provider

      - model: authentik_providers_proxy.proxyprovider
        id: jellyseerr-provider
        state: present
        identifiers:
          name: Jellyseerr Provider
        attrs:
          name: Jellyseerr Provider
          mode: forward_single
          external_host: https://requests.${TAILNET_DOMAIN}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: jellyseerr
        attrs:
          name: Jellyseerr
          slug: jellyseerr
          provider: !KeyOf jellyseerr-provider
