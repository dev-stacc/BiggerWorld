apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-arr
  namespace: authentik
data:
  arr.yaml: |
    version: 1
    metadata:
      name: Arr Stack Applications
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: qbittorrent-provider
        state: present
        identifiers:
          name: qBittorrent Provider
        attrs:
          name: qBittorrent Provider
          mode: forward_single
          external_host: https://torrents.${TAILNET_DOMAIN}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: qbittorrent
        attrs:
          name: qBittorrent
          slug: qbittorrent
          provider: !KeyOf qbittorrent-provider
