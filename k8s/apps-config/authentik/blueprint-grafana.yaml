apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-grafana
  namespace: authentik
data:
  grafana.yaml: |
    version: 1
    metadata:
      name: Grafana OAuth Application
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        state: present
        identifiers:
          name: grafana-oauth
        attrs:
          name: grafana-oauth
          client_id: !Env GRAFANA_OAUTH_CLIENT_ID
          client_secret: !Env GRAFANA_OAUTH_CLIENT_SECRET
          # Required since authentik 2026.x: an OAuth2 provider created without this
          # gets grant_types=[] and rejects the code flow with "Invalid grant_type
          # for provider", which surfaces to the client only as invalid_request.
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.${TAILNET_DOMAIN}/login/generic_oauth
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # no cert carries managed=goauthentik.io/crypto/default-certificate, so
          # that lookup silently yielded null and authentik fell back to HS256.
          # authentik also only re-applies a blueprint when its content changes,
          # so a rotated client_secret in vault needs an edit here to propagate.
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          sub_mode: hashed_user_id
          issuer_mode: per_provider

      - model: authentik_core.application
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          slug: grafana
          provider: !KeyOf grafana-provider
