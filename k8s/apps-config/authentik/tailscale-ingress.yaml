apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ts-authentik
  namespace: authentik
  annotations:
    tailscale.com/hostname: authentik
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: authentik-server
      port:
        number: 80
  tls:
    - hosts:
        - authentik
